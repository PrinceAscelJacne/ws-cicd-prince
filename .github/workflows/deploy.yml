name: CI-CD

# TODO 1 : déclencher aussi le workflow à chaque push sur la branche main
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
permissions:
      contents: read
      packages: write
      
    # TODO 2 : donner à ce job les permissions "contents: read" et "packages: write"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # TODO 3 : se connecter à ghcr.io avec docker/login-action@v3
      
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      #          (utilisateur : github.actor ; mot de passe : secrets.GITHUB_TOKEN)

      # TODO 4 : construire et publier l'image avec docker/build-push-action@v6
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      #          - tags : <IMAGE>:<SHA du commit> et <IMAGE>:latest
      #          - argument de build APP_VERSION = SHA du commit

  deploy:
      needs: build-and-push
    # TODO 5 : ne lancer ce job qu'après la réussite du job build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # TODO 6 : préparer la connexion SSH
      - name: Préparer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      #          - écrire la clé du secret SSH_KEY dans ~/.ssh/id_deploy (droits 600)
      #          - ajouter l'hôte à known_hosts avec ssh-keyscan

      # TODO 7 : se connecter à la VM (secrets SSH_USER et SSH_HOST) et y exécuter :
      - name: Déployer sur la VM
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker pull $IMAGE:${{ github.sha }} && (docker rm -f webapp || true) && docker run -d --name webapp --restart unless-stopped -p 8080:5000 $IMAGE:${{ github.sha }}"
      #          docker pull, suppression de l'ancien conteneur "webapp",
      #          docker run -d --name webapp --restart unless-stopped -p 80:5000 <image>:<sha>
